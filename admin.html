<!DOCTYPE html>
<html>
<head>
    <title>Sistem Rute Driver</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f4f4f9; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 100px; margin-bottom: 10px; }
        button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #hasil { margin-top: 20px; white-space: pre-line; }
    </style>
</head>
<body>

<div class="container">
    <h2>Sistem Bagi Rute</h2>
    <p>Masukkan Nama Driver (Pisahkan dengan koma):</p>
    <textarea id="drivers" placeholder="Andi, Budi, Candra"></textarea>
    <p>Masukkan Data Order (Nama, Alamat, Kecamatan):</p>
    <textarea id="dataOrder" placeholder="Contoh: Budi, Jl Sukun 1, SUKUN"></textarea>
    <button onclick="prosesRute()">Urutkan & Bagi Rute</button>
    <div id="hasil"></div>
</div>

<script>
function prosesRute() {
    let drivers = document.getElementById('drivers').value.split(',').map(d => d.trim());
    let rawData = document.getElementById('dataOrder').value.split('\n');
    
    // Klaster & Urutan
    const klaster = {
        "SUKUN": "BLOK_BARAT_UTARA", "KLOJEN": "BLOK_BARAT_UTARA", "LOWOKWARU": "BLOK_BARAT_UTARA",
        "BLIMBING": "BLOK_TIMUR_UTARAJAUH", "SINGOSARI": "BLOK_TIMUR_UTARAJAUH", "PAKIS": "BLOK_TIMUR_UTARAJAUH",
        "WAGIR": "BLOK_SELATAN", "KEPANJEN": "BLOK_SELATAN", "TUREN": "BLOK_SELATAN"
    };

    let list = rawData.map(line => {
        let [nama, alamat, kec] = line.split(',').map(s => s.trim().toUpperCase());
        return { nama, alamat, kec, blok: klaster[kec] || "LAIN-LAIN" };
    });

    // Simulasi Rolling Sederhana (bisa dikembangkan dengan LocalStorage)
    let output = "HASIL PEMBAGIAN:\n";
    list.forEach((item, index) => {
        let driver = drivers[index % drivers.length];
        output += `${item.nama} - ${item.blok} -> Driver: ${driver}\n`;
    });

    document.getElementById('hasil').innerText = output;
}
</script>
</body>
</html>
