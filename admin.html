<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Route Dashboard - Driver Logistics</title>
    <!-- Menggunakan font modern Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #059669;
            --success-hover: #047857;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --warning: #d97706;
            --info: #0284c7;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border: #cbd5e1;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 30px 20px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 950px;
            margin: auto;
            background: var(--card-bg);
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 20px;
        }

        .header-title h2 {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-main);
            margin: 0;
            letter-spacing: -0.5px;
        }

        .header-title span {
            font-size: 32px;
        }

        .card-box {
            background: #ffffff;
            padding: 22px;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1.5px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.01);
        }

        label {
            font-weight: 700;
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 15px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 15px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600;
            color: var(--text-main);
            background: #fff;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
        }

        /* Checkbox Driver Modern */
        .driver-checkbox-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 5px;
        }

        .driver-checkbox-group label {
            background: #f8fafc;
            border: 1.5px solid var(--border);
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: none;
            letter-spacing: normal;
            transition: all 0.2s;
        }

        .driver-checkbox-group label:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }

        .driver-checkbox-group input {
            accent-color: var(--primary);
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 18px;
            cursor: pointer;
            border: none;
            border-radius: 12px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            color: white;
            font-size: 14px;
            letter-spacing: 0.3px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            flex: 1;
            min-width: 130px;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-add { background: var(--primary); }
        .btn-add:hover { background: var(--primary-hover); }

        .btn-run { background: var(--success); }
        .btn-run:hover { background: var(--success-hover); }

        .btn-print { background: var(--warning); color: #fff; }
        .btn-print:hover { background: #b45309; }

        .btn-excel { background: var(--info); color: #fff; }
        .btn-excel:hover { background: #0369a1; }

        .btn-reset { background: var(--danger); min-width: 90px; }
        .btn-reset:hover { background: var(--danger-hover); }

        /* Tabel Antrean Modern */
        .table-wrapper {
            max-height: 280px;
            overflow-y: auto;
            border: 1.5px solid var(--border);
            border-radius: 14px;
            background: white;
            margin-top: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px 18px;
            text-align: left;
            font-size: 14px;
        }

        th {
            background-color: #f8fafc;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1.5px solid var(--border);
            position: sticky;
            top: 0;
        }

        td {
            border-bottom: 1px solid #f1f5f9;
            font-weight: 500;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        .delete-btn {
            background: #fee2e2;
            color: var(--danger);
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            box-shadow: none;
            transition: background 0.2s;
            min-width: auto;
        }

        .delete-btn:hover {
            background: #fecaca;
        }

        /* Kartu Hasil Pembagian Per Driver */
        .driver-card {
            margin-top: 30px;
            background: white;
            border: 1.5px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
        }

        .driver-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            padding: 16px 22px;
            font-weight: 700;
            font-size: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            letter-spacing: -0.3px;
        }

        .badge {
            background: rgba(255, 255, 255, 0.25);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: normal;
        }

        /* Mode Print / PDF */
        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; padding: 0; max-width: 100%; }
            .card-box, .btn-group, h3#judulAntrean, div#tabelAntreanBox, .delete-btn { display: none !important; }
            .driver-card { border: 1.5px solid #0f172a; page-break-inside: avoid; margin-bottom: 25px; box-shadow: none; }
            .driver-header { background: #0f172a !important; -webkit-print-color-adjust: exact; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">
        <span>⚡</span>
        <h2>Smart Route Dashboard</h2>
    </div>
    
    <!-- Driver Aktif -->
    <div class="card-box">
        <label>Driver Aktif Hari Ini</label>
        <div class="driver-checkbox-group" id="driverCheckboxes">
            <label><input type="checkbox" value="PONIADI" checked> PONIADI</label>
            <label><input type="checkbox" value="EKO" checked> EKO</label>
            <label><input type="checkbox" value="DEDY" checked> DEDY</label>
        </div>
    </div>

    <!-- Form Input -->
    <div class="card-box">
        <label>Input Orderan Masuk</label>
        <input type="text" id="inputNama" placeholder="Nama Toko / Customer">
        <input type="text" id="inputAlamat" placeholder="Alamat Lengkap">
        
        <label>Kecamatan Tujuan</label>
        <select id="inputKec">
            <option value="">-- Pilih Kecamatan --</option>
            <optgroup label="Blok Barat & Utara">
                <option value="SUKUN">Sukun</option>
                <option value="KLOJEN">Klojen</option>
                <option value="LOWOKWARU">Lowokwaru</option>
                <option value="DAU">Dau</option>
                <option value="KARANGPLOSO">Karangploso</option>
            </optgroup>
            <optgroup label="Blok Timur & Utara Jauh">
                <option value="BLIMBING">Blimbing</option>
                <option value="KEDUNGKANDANG">Kedungkandang</option>
                <option value="SINGOSARI">Singosari</option>
                <option value="LAWANG">Lawang</option>
                <option value="PAKIS">Pakis</option>
                <option value="TAJINAN">Tajinan</option>
                <option value="JABUNG">Jabung</option>
                <option value="WAJAK">Wajak</option>
            </optgroup>
            <optgroup label="Blok Selatan">
                <option value="WAGIR">Wagir</option>
                <option value="PAKISAJI">Pakisaji</option>
                <option value="BULULAWANG">Bululawang</option>
                <option value="KEPANJEN">Kepanjen</option>
                <option value="GONDANGLEGI">Gondanglegi</option>
                <option value="TUREN">Turen</option>
                <option value="DAMPIT">Dampit</option>
                <option value="PAGELARAN">Pagelaran</option>
            </optgroup>
        </select>
        
        <div class="btn-group">
            <button class="btn-add" onclick="tambahOrderan()">+ Tambah</button>
            <button class="btn-run" onclick="bagiRute()">🚀 Bagi Rute</button>
            <button class="btn-print" onclick="cetakPDF()">🖨️ Cetak PDF</button>
            <button class="btn-excel" onclick="downloadExcel()">📊 Download Excel</button>
            <button class="btn-reset" onclick="resetSemua()">Reset</button>
        </div>
    </div>

    <h3 id="judulAntrean" style="font-size: 15px; font-weight: 700; margin-top: 25px; color: var(--text-main); text-transform: uppercase; letter-spacing: 0.5px;">List Antrean Masuk (<span id="jumlahAntrean">0</span> Orderan)</h3>
    <div id="tabelAntreanBox" class="table-wrapper">
        <table id="tabelAntrean">
            <tr><th>Nama / Toko</th><th>Alamat Lengkap</th><th>Kecamatan</th><th style="width: 100px; text-align: center;">Aksi</th></tr>
        </table>
    </div>

    <div id="hasilPembagian"></div>
</div>

<script>
let antrean = JSON.parse(localStorage.getItem('antrean')) || [];
let hasilPembagianGlobal = {}; // Untuk menyimpan data pembagian terakhir agar bisa didownload ke excel

const klaster = {
    "SUKUN": {blok: "BARAT & UTARA", urut: 1}, "KLOJEN": {blok: "BARAT & UTARA", urut: 2}, 
    "LOWOKWARU": {blok: "BARAT & UTARA", urut: 3}, "DAU": {blok: "BARAT & UTARA", urut: 4}, 
    "KARANGPLOSO": {blok: "BARAT & UTARA", urut: 5},
    
    "BLIMBING": {blok: "TIMUR & UTARA JAUH", urut: 6}, "KEDUNGKANDANG": {blok: "TIMUR & UTARA JAUH", urut: 7}, 
    "SINGOSARI": {blok: "TIMUR & UTARA JAUH", urut: 8}, "LAWANG": {blok: "TIMUR & UTARA JAUH", urut: 9}, 
    "PAKIS": {blok: "TIMUR & UTARA JAUH", urut: 10}, "TAJINAN": {blok: "TIMUR & UTARA JAUH", urut: 11}, 
    "JABUNG": {blok: "TIMUR & UTARA JAUH", urut: 12}, "WAJAK": {blok: "TIMUR & UTARA JAUH", urut: 13},
    
    "WAGIR": {blok: "SELATAN", urut: 14}, "PAKISAJI": {blok: "SELATAN", urut: 15}, 
    "BULULAWANG": {blok: "SELATAN", urut: 16}, "KEPANJEN": {blok: "SELATAN", urut: 17}, 
    "GONDANGLEGI": {blok: "SELATAN", urut: 18}, "TUREN": {blok: "SELATAN", urut: 19}, 
    "DAMPIT": {blok: "SELATAN", urut: 20}, "PAGELARAN": {blok: "SELATAN", urut: 21}
};

function renderAntrean() {
    let html = `<tr><th>Nama / Toko</th><th>Alamat Lengkap</th><th>Kecamatan</th><th style="width: 100px; text-align: center;">Aksi</th></tr>`;
    if (antrean.length === 0) {
        html += `<tr><td colspan="4" style="text-align:center; color:var(--text-muted); padding: 30px; font-weight: 600;">Belum ada orderan masuk di antrean.</td></tr>`;
    } else {
        antrean.forEach((item, index) => {
            html += `<tr>
                <td><b>${item.nama}</b></td>
                <td>${item.alamat}</td>
                <td><span style="background: #f1f5f9; border: 1px solid var(--border); padding: 5px 10px; border-radius: 8px; font-size: 12px; font-weight: 700;">${item.kec}</span></td>
                <td style="text-align: center;"><button class="delete-btn" onclick="hapusItem(${index})">Hapus</button></td>
            </tr>`;
        });
    }
    document.getElementById('tabelAntrean').innerHTML = html;
    document.getElementById('jumlahAntrean').innerText = antrean.length;
    localStorage.setItem('antrean', JSON.stringify(antrean));
}

function tambahOrderan() {
    let nama = document.getElementById('inputNama').value.trim();
    let alamat = document.getElementById('inputAlamat').value.trim();
    let kec = document.getElementById('inputKec').value;

    if(!nama || !alamat || !kec) {
        alert("⚠️ Mohon isi Nama, Alamat, dan pilih Kecamatan dengan lengkap!");
        return;
    }

    antrean.push({ nama, alamat, kec });
    
    document.getElementById('inputNama').value = "";
    document.getElementById('inputAlamat').value = "";
    document.getElementById('inputKec').value = "";
    document.getElementById('inputNama').focus();

    renderAntrean();
}

function hapusItem(index) {
    antrean.splice(index, 1);
    renderAntrean();
}

function resetSemua() {
    if(confirm("Hapus seluruh list antrean?")) {
        antrean = [];
        localStorage.removeItem('antrean');
        renderAntrean();
        document.getElementById('hasilPembagian').innerHTML = "";
        hasilPembagianGlobal = {};
    }
}

function getActiveDrivers() {
    let checkboxes = document.querySelectorAll('#driverCheckboxes input[type="checkbox"]:checked');
    let activeDrivers = [];
    checkboxes.forEach(cb => activeDrivers.push(cb.value));
    return activeDrivers;
}

function bagiRute() {
    let drivers = getActiveDrivers();

    if(drivers.length === 0) {
        alert("⚠️ Centang minimal 1 Driver yang aktif bertugas!");
        return;
    }
    if(antrean.length === 0) {
        alert("⚠️ List antrean masih kosong!");
        return;
    }

    antrean.sort((a, b) => {
        let uA = klaster[a.kec]?.urut || 99;
        let uB = klaster[b.kec]?.urut || 99;
        return uA - uB;
    });

    let listBlok = ["BARAT & UTARA", "TIMUR & UTARA JAUH", "SELATAN"];
    let blokKeDriver = {};
    listBlok.forEach((blok, idx) => {
        blokKeDriver[blok] = drivers[idx % drivers.length];
    });

    let driverData = {};
    drivers.forEach(d => driverData[d] = []);

    antrean.forEach(item => {
        let infoBlok = klaster[item.kec]?.blok || "BARAT & UTARA";
        let assignedDriver = blokKeDriver[infoBlok] || drivers[0];
        driverData[assignedDriver].push(item);
    });

    hasilPembagianGlobal = driverData; // Simpan untuk excel

    let htmlOutput = "<h3 style='margin-top: 35px; font-size: 18px; font-weight: 800; color: var(--text-main); letter-spacing: -0.3px;'>📦 Hasil Pembagian Tugas Driver</h3>";
    
    for (let driver in driverData) {
        let orders = driverData[driver];
        htmlOutput += `
            <div class="driver-card">
                <div class="driver-header">
                    <span>🚗 Driver: ${driver}</span>
                    <span class="badge">${orders.length} Kiriman</span>
                </div>
                <table>
                    <tr>
                        <th style="width: 5%">No</th>
                        <th style="width: 30%">Nama / Toko</th>
                        <th style="width: 50%">Alamat Lengkap</th>
                        <th style="width: 15%">Kecamatan</th>
                    </tr>`;
        
        if (orders.length === 0) {
            htmlOutput += `<tr><td colspan="4" style="text-align:center; color:var(--text-muted); padding: 20px; font-weight: 600;">Tidak ada kiriman di rute ini.</td></tr>`;
        } else {
            orders.forEach((ord, index) => {
                htmlOutput += `<tr>
                    <td><b>${index + 1}</b></td>
                    <td><b>${ord.nama}</b></td>
                    <td>${ord.alamat}</td>
                    <td><span style="background: #f1f5f9; border: 1px solid var(--border); padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 700;">${ord.kec}</span></td>
                </tr>`;
            });
        }
        htmlOutput += `</table></div>`;
    }

    document.getElementById('hasilPembagian').innerHTML = htmlOutput;
}

function cetakPDF() {
    if(Object.keys(hasilPembagianGlobal).length === 0) {
        alert("⚠️ Klik tombol 'Bagi Rute' terlebih dahulu sebelum mencetak!");
        return;
    }
    window.print();
}

function downloadExcel() {
    if(Object.keys(hasilPembagianGlobal).length === 0) {
        alert("⚠️ Klik tombol 'Bagi Rute' terlebih dahulu sebelum mendownload Excel!");
        return;
    }

    // Buat format CSV yang bisa dibaca Excel
    let csvContent = "\uFEFF"; // BOM untuk support Excel UTF-8
    csvContent += "Driver,No,Nama Toko,Alamat Lengkap,Kecamatan\n";

    for (let driver in hasilPembagianGlobal) {
        let orders = hasilPembagianGlobal[driver];
        orders.forEach((ord, idx) => {
            // Bersihkan tanda koma ganda agar format CSV tidak berantakan di Excel
            let cleanNama = `"${(ord.nama || "").replace(/"/g, '""')}"`;
            let cleanAlamat = `"${(ord.alamat || "").replace(/"/g, '""')}"`;
            let cleanKec = `"${(ord.kec || "").replace(/"/g, '""')}"`;
            
            csvContent += `"${driver}",${idx + 1},${cleanNama},${cleanAlamat},${cleanKec}\n`;
        });
    }

    // Trigger download file
    let blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    let url = URL.createObjectURL(blob);
    let a = document.createElement('a');
    a.href = url;
    a.download = `Data_Rute_Driver_${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

renderAntrean();
</script>
</body>
</html>
