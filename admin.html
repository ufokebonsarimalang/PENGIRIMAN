<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Rute Pengiriman UFO Kebonsari</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;850&display=swap');
    body { font-family: 'Inter', Arial, sans-serif; background: #f4f6f9; color: #111; margin: 0; padding: 16px; }
    .container { max-width: 650px; margin: 0 auto; }
    .card { background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); margin-bottom: 16px; border: 1px solid #e2e8f0; }
    h3 { margin-top: 0; font-size: 16px; font-weight: 850; color: #6d28d9; text-transform: uppercase; margin-bottom: 12px; }
    p { font-size: 12px; color: #64748b; margin-bottom: 12px; }
    .driver-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .driver-label { display: flex; align-items: center; gap: 8px; background: #f8fafc; padding: 10px 12px; border-radius: 10px; border: 1px solid #cbd5e1; font-size: 13px; font-weight: 600; cursor: pointer; }
    button { width: 100%; padding: 14px; border: none; border-radius: 12px; background: linear-gradient(135deg, #6d28d9 0%, #4c1d95 100%); color: #fff; font-weight: 800; font-size: 14px; cursor: pointer; }
    .table-container { max-height: 400px; overflow-y: auto; border-radius: 10px; border: 1px solid #e2e8f0; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
    th, td { padding: 12px 10px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    th { background: #f8fafc; font-weight: 700; color: #475569; position: sticky; top: 0; }
    .input-maps { flex: 1; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 11px; }
    .btn-simpan-row { background: #2563eb; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; font-size: 10px; font-weight: 700; cursor: pointer; }
    .badge-driver { background: #e0e7ff; color: #3730a3; padding: 4px 8px; border-radius: 6px; font-weight: 700; font-size: 11px; }
    .badge-none { color: #94a3b8; font-style: italic; }
    .badge-sutoyo { background: #fee2e2; color: #991b1b; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; margin-left: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card" style="border: 2px dashed #6d28d9; background: #fcfbff;">
      <h3>Tambah Order Grosir / Manual</h3>
      <input type="text" id="grosirDetail" placeholder="Nama Toko" style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:8px; margin-bottom:8px; box-sizing:border-box;">
      <input type="text" id="grosirMaps" placeholder="Link Maps" style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:8px; margin-bottom:8px; box-sizing:border-box;">
      <button onclick="tambahOrderGrosir()">+ TAMBAHKAN</button>
    </div>

    <div class="card">
      <h3>Panel Eksekusi Rute</h3>
      <div class="driver-grid" id="driverCheckboxList"></div>
      <button id="btnBagi" onclick="eksekusiBagiRute()">BAGI RUTE OTOMATIS SEARAH</button>
      <div id="logStatus" style="margin-top:10px; text-align:center; font-weight:700; font-size:12px; color:#059669;"></div>
    </div>

    <div class="card">
      <h3>Daftar Order Masuk</h3>
      <div class="table-container">
        <table id="tabelOrder">
          <tr><th>Detail Pesanan</th><th>Link Maps</th><th>Driver</th></tr>
        </table>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzH4e2dQErvrU5m_1Q-s66gxG68JaKFae2foTcOrTUHiZT42sqY0xYHV4Cv04_Dowgi/exec";

    function muatDataAdmin() {
      fetch(API_URL)
      .then(res => res.json())
      .then(data => {
        const orders = data.orders || [];
        let htmlTable = "";
        // Looping full 100% tanpa batas, melewatkan baris kosong
        for (let i = 1; i < orders.length; i++) {
          let row = orders[i];
          if (!row[0] || row[0].toString().trim() === "") continue;
          
          let rowNum = i + 1;
          let isSutoyo = row[0].toLowerCase().includes("sutoyo");
          htmlTable += `<tr>
            <td>${row[0]} ${isSutoyo ? '<span class="badge-sutoyo">SUTOYO</span>' : ''}</td>
            <td><div style="display:flex; gap:5px;"><input type="text" id="maps-input-${rowNum}" class="input-maps" value="${row[3] || ''}"><button class="btn-simpan-row" onclick="simpanLinkRow(${rowNum})">SIMPAN</button></div></td>
            <td><span class="${row[2] ? 'badge-driver' : 'badge-none'}">${row[2] || 'Belum dibagi'}</span></td>
          </tr>`;
        }
        document.getElementById("tabelOrder").innerHTML = `<tr><th>Detail Pesanan</th><th>Link Maps</th><th>Driver</th></tr>` + htmlTable;
      });

      fetch(API_URL + "?action=getDrivers")
      .then(res => res.json())
      .then(res => {
        let htmlD = "";
        res.drivers.forEach(d => htmlD += `<label class="driver-label"><input type="checkbox" value="${d.name}" checked> ${d.name}</label>`);
        document.getElementById("driverCheckboxList").innerHTML = htmlD;
      });
    }

    function simpanLinkRow(n) {
      let val = document.getElementById("maps-input-" + n).value;
      fetch(API_URL, {method:"POST", body:JSON.stringify({action:"updateMaps", row:n, link:val})}).then(() => alert("Tersimpan!"));
    }

    function eksekusiBagiRute() {
      let d = Array.from(document.querySelectorAll('#driverCheckboxList input:checked')).map(cb => cb.value);
      fetch(API_URL, {method:"POST", body:JSON.stringify({action:"bagiRute", drivers:d})}).then(r=>r.json()).then(res => {alert(res.message); muatDataAdmin();});
    }

    function tambahOrderGrosir() {
      let d = document.getElementById("grosirDetail").value;
      let m = document.getElementById("grosirMaps").value;
      fetch(API_URL, {method:"POST", body:JSON.stringify({action:"tambahGrosir", detail:d, link:m})}).then(() => {alert("Berhasil!"); muatDataAdmin();});
    }

    window.onload = muatDataAdmin;
  </script>
</body>
</html>
