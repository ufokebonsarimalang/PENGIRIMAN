<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no">
<title>Admin Panel - Rute Pengiriman</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

body{
margin:0;
font-family:'Inter', Arial, sans-serif;
background:#f4f6f9;
color:#111;
-webkit-font-smoothing: antialiased;
padding: 12px;
}

.container{
max-width: 480px;
margin: 0 auto;
}

/* HEADER */
.header{
background:#fff;
padding:12px 16px;
border-radius:16px;
margin-bottom:12px;
border:2px solid #6d28d9;
box-shadow:0 4px 16px rgba(109,40,217,0.15);
display: flex;
justify-content: space-between;
align-items: center;
}

.header-title{
font-size:16px;
font-weight:900;
color:#6d28d9;
letter-spacing:0.5px;
text-transform: uppercase;
}

/* KARTU KONTROL PANEL */
.card-panel {
background: #fff;
padding: 16px;
border-radius: 16px;
border: 1.5px solid #e2e8f0;
box-shadow: 0 4px 12px rgba(0,0,0,.03);
margin-bottom: 12px;
}

.card-title {
font-size: 13px;
font-weight: 900;
color: #6d28d9;
margin-bottom: 10px;
text-transform: uppercase;
}

/* Driver Checkbox List */
.driver-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 8px;
margin-bottom: 12px;
}

.driver-label {
display: flex;
align-items: center;
gap: 8px;
background: #f8fafc;
padding: 8px 10px;
border-radius: 10px;
border: 1px solid #cbd5e1;
font-size: 12px;
font-weight: 600;
cursor: pointer;
}

.driver-label input {
accent-color: #6d28d9;
width: 14px;
height: 14px;
}

/* BUTTON UTAMA */
button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background: linear-gradient(135deg, #6d28d9 0%, #4c1d95 100%);
color:#fff;
font-weight:800;
cursor:pointer;
font-size: 13px;
box-shadow: 0 4px 12px rgba(109, 40, 217, 0.3);
}

button:disabled {
background: #a1a1a1 !important;
cursor: not-allowed;
box-shadow: none;
}

/* PENCARIAN */
.search-container {
margin-bottom: 12px;
}
.search-input {
width: 100%;
padding: 12px 16px;
border-radius: 12px;
border: 2px solid #6d28d9;
font-size: 14px;
font-weight: 600;
box-shadow: 0 2px 8px rgba(109,40,217,0.08);
box-sizing: border-box;
outline: none;
}

/* KARTU ORDER (MIRIP HALAMAN DRIVER) */
.card{
background:#fff;
padding:14px;
margin-bottom:12px;
border-radius:16px;
border:1.5px solid #e2e8f0;
box-shadow:0 4px 12px rgba(0,0,0,.03);
font-size:13px;
line-height:1.5;
position:relative;
}

.data{
white-space:pre-line;
font-weight:600;
color: #1e293b;
margin-bottom: 8px;
}

/* BADGE DRIVER & SUTOYO */
.card-header-row {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 8px;
}

.badge-driver {
background: #e0e7ff;
color: #3730a3;
padding: 4px 8px;
border-radius: 6px;
font-weight: 800;
font-size: 11px;
}

.badge-none {
background: #f1f5f9;
color: #94a3b8;
padding: 4px 8px;
border-radius: 6px;
font-style: italic;
font-size: 11px;
}

.badge-sutoyo {
background: #fee2e2;
color: #991b1b;
padding: 3px 8px;
border-radius: 6px;
font-size: 10px;
font-weight: 800;
letter-spacing: 0.3px;
display: inline-block;
margin-bottom: 6px;
}

/* INPUT MAPS ADMIN DALAM KARTU */
.maps-action-wrapper {
display: flex;
gap: 6px;
margin-top: 10px;
}

.input-maps {
flex: 1;
padding: 8px 10px;
border: 1px solid #cbd5e1;
border-radius: 8px;
font-size: 11px;
box-sizing: border-box;
outline: none;
}

.btn-simpan-row {
background: #2563eb;
color: #fff;
border: none;
padding: 8px 12px;
border-radius: 8px;
font-size: 11px;
font-weight: 800;
cursor: pointer;
width: auto;
white-space: nowrap;
box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
}

.btn-simpan-row:hover {
background: #1d4ed8;
}

#logStatus {
margin-top: 10px;
text-align: center;
font-weight: 700;
font-size: 12px;
color: #059669;
}
</style>
</head>

<body>

<div class="container">
  
  <!-- HEADER -->
  <div class="header">
    <div class="header-title">ADMIN PANEL RUTE</div>
  </div>

  <!-- KARTU 1: TAMBAH ORDER GROSIR / MANUAL -->
  <div class="card-panel" style="border: 2px dashed #6d28d9; background: #fcfbff;">
    <div class="card-title">Tambah Order Grosir / Manual</div>
    <p style="font-size:11px; color:#64748b; margin:0 0 10px 0;">Untuk pelanggan grosir yang tidak isi form, ketik nama toko &amp; paste link maps-nya.</p>
    
    <input type="text" id="grosirDetail" placeholder="Nama Toko / Detail Pesanan" style="width:100%; padding:10px; margin-bottom:8px; border-radius:8px; border:1px solid #ddd; font-size:12px; box-sizing:border-box;">
    <input type="text" id="grosirMaps" placeholder="Paste Link Google Maps..." style="width:100%; padding:10px; margin-bottom:10px; border-radius:8px; border:1px solid #ddd; font-size:12px; box-sizing:border-box;">
    
    <button type="button" onclick="tambahOrderGrosir()" style="background:#059669; font-size:12px; padding:10px;">+ TAMBAHKAN KE DAFTAR</button>
  </div>

  <!-- KARTU 2: PANEL EKSEKUSI RUTE & ROLLING -->
  <div class="card-panel">
    <div class="card-title">Panel Eksekusi Rute &amp; Rolling</div>
    <p style="font-size:11px; color:#64748b; margin:0 0 10px 0;">Centang driver yang aktif hari ini, lalu klik tombol untuk membagi rute secara searah dan bergiliran.</p>
    
    <div class="driver-grid" id="driverCheckboxList">
      <div style="grid-column: span 2; text-align:center; color:#64748b; font-size:12px;">Memuat driver...</div>
    </div>

    <button type="button" id="btnBagi" onclick="eksekusiBagiRute()">BAGI RUTE OTOMATIS SEARAH</button>
    <div id="logStatus"></div>
  </div>

  <!-- KARTU 3: PENCARIAN -->
  <div class="search-container">
    <input type="text" id="cariCustomer" class="search-input" placeholder="🔍 Cari nama customer / toko..." onkeyup="filterCustomer()">
  </div>

  <!-- DAFTAR KARTU PESANAN (SAMA PERSIS DENGAN DRIVER) -->
  <div id="list"></div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzH4e2dQErvrU5m_1Q-s66gxG68JaKFae2foTcOrTUHiZT42sqY0xYHV4Cv04_Dowgi/exec";

window.onload = function() {
  muatDataAdmin();
};

function muatDataAdmin() {
  // Tarik Data Pesanan
  fetch(API_URL)
  .then(res => res.json())
  .then(data => {
    const orders = data.orders || [];
    let html = "";
    let count = 0;

    // Membaca seluruh baris dari awal sampai akhir tanpa terpotong (mendukung 400+ baris)
    for (let i = 1; i < orders.length; i++) {
      let row = orders[i];
      let detail = row[0] || "";
      let driver = row[2] || "";
      let linkMaps = row[3] || "";

      if(detail.toString().trim() === "") continue;

      count++;
      let rowNum = i + 1;
      let isSutoyo = detail.toLowerCase().includes("sutoyo");
      let badgeDriver = driver ? `<span class="badge-driver">👤 ${driver}</span>` : `<span class="badge-none">Belum dibagi</span>`;
      
      html += '<div class="card" data-customer="' + detail.toLowerCase() + '">';
      
      if(isSutoyo) {
        html += '<div><span class="badge-sutoyo">📍 JALUR SUTOYO</span></div>';
      }

      html += '<div class="card-header-row">';
      html += '<div class="data" style="margin:0; flex:1;">' + detail + '</div>';
      html += badgeDriver;
      html += '</div>';

      // Kotak Input Maps & Tombol Simpan langsung di dalam kartu
      html += '<div class="maps-action-wrapper">';
      html += '<input type="text" id="maps-input-' + rowNum + '" class="input-maps" value="' + linkMaps + '" placeholder="Paste link Google Maps...">';
      html += '<button type="button" class="btn-simpan-row" onclick="simpanLinkRow(' + rowNum + ')">💾 SIMPAN</button>';
      html += '</div>';

      html += '</div>';
    }

    if (count === 0) {
      html = '<div style="text-align:center; color:#64748b; padding:20px; background:#fff; border-radius:16px;">Belum ada data pesanan.</div>';
    }

    document.getElementById("list").innerHTML = html;
    filterCustomer();
  });

  // Tarik List Driver untuk Checkbox
  fetch(API_URL + "?action=getDrivers")
  .then(res => res.json())
  .then(res => {
    if(res.status === "OK" && res.drivers) {
      let htmlDrivers = "";
      res.drivers.forEach(d => {
        let checked = d.status.toLowerCase() === 'aktif' ? 'checked' : '';
        htmlDrivers += `<label class="driver-label">
                          <input type="checkbox" value="${d.name}" ${checked}> ${d.name}
                        </label>`;
      });
      document.getElementById("driverCheckboxList").innerHTML = htmlDrivers;
    }
  });
}

// Fungsi Simpan Link Maps per Baris
function simpanLinkRow(rowNum) {
  let inputEl = document.getElementById("maps-input-" + rowNum);
  if (!inputEl) return;
  
  let linkValue = inputEl.value.trim();
  let btn = event.target;
  let oldText = btn.innerText;
  btn.disabled = true;
  btn.innerText = "...";

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "updateMaps",
      row: rowNum,
      link: linkValue
    })
  })
  .then(res => res.json())
  .then(res => {
    btn.disabled = false;
    btn.innerText = oldText;
    if(res.status === "OK") {
      alert("Link Google Maps berhasil dikunci & disimpan!");
    } else {
      alert("Gagal menyimpan link maps.");
    }
  })
  .catch(() => {
    btn.disabled = false;
    btn.innerText = oldText;
    alert("Koneksi gagal.");
  });
}

// Fungsi Tambah Order Grosir / Manual
function tambahOrderGrosir() {
  let detail = document.getElementById("grosirDetail").value.trim();
  let maps = document.getElementById("grosirMaps").value.trim();

  if (!detail) {
    alert("Nama toko / detail pesanan wajib diisi!");
    return;
  }

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "tambahGrosir",
      detail: "GROSIR: " + detail,
      link: maps
    })
  })
  .then(res => res.json())
  .then(res => {
    if (res.status === "OK") {
      document.getElementById("grosirDetail").value = "";
      document.getElementById("grosirMaps").value = "";
      alert("Order grosir berhasil ditambahkan!");
      muatDataAdmin(); 
    } else {
      alert("Gagal menambahkan grosir.");
    }
  });
}

// Tombol Eksekusi Bagi Rute Otomatis
function eksekusiBagiRute() {
  let checkboxes = document.querySelectorAll('#driverCheckboxList input[type="checkbox"]:checked');
  let driverAktif = Array.from(checkboxes).map(cb => cb.value);

  if (driverAktif.length === 0) {
    alert("Pilih minimal 1 driver yang aktif!");
    return;
  }

  const btn = document.getElementById("btnBagi");
  const log = document.getElementById("logStatus");

  btn.disabled = true;
  btn.innerText = "MEMPROSES RUTE...";
  log.innerText = "";

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "bagiRute",
      drivers: driverAktif
    })
  })
  .then(res => res.json())
  .then(res => {
    btn.disabled = false;
    btn.innerText = "BAGI RUTE OTOMATIS SEARAH";
    
    if (res.status === "OK") {
      log.style.color = "#059669";
      log.innerText = res.message;
      muatDataAdmin();
    } else {
      log.style.color = "#dc2626";
      log.innerText = "Gagal: " + res.message;
    }
  });
}

// Fungsi Pencarian Customer
function filterCustomer() {
  const keyword = document.getElementById("cariCustomer").value.toLowerCase();
  const cards = document.querySelectorAll(".card");
  
  cards.forEach(card => {
    const namaCustomer = card.getAttribute("data-customer");
    if (namaCustomer.includes(keyword)) {
      card.style.display = "block";
    } else {
      card.style.display = "none";
    }
  });
}
</script>

</body>
</html>
